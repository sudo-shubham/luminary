<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Luminary — Photography Assistant &amp; Solar Ephemeris</title>
  <meta name="description" content="Location-aware camera settings, solar ephemeris, and real-time compass light-source radar for photographers." />

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/luminary-icon-192x192.png" />
  <link rel="apple-touch-icon" href="/luminary-icon-192x192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Early Theme Init Script to Prevent FOUT (Flash of Unstyled Theme) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('luminary_theme');
        var prefersDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans select-none antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Luminary SW registered:', reg.scope))
          .catch(err => console.log('Luminary SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
