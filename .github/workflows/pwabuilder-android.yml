name: Build Signed Android APK & Bundle (TWA)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build & Sign Android APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 2.1 Install Dependencies & Build Bundle
        run: |
          npm ci
          npm run build

      - name: 3. Validate PWA Criteria
        run: node scripts/validate-pwa.js

      - name: 4. Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Configure Android SDK & Bubblewrap CLI
        run: |
          echo "=========================================="
          echo "🤖 Configuring Android SDK & Bubblewrap CLI"
          echo "=========================================="
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Bubblewrap expects tools/ and bin/ directories inside ANDROID_HOME
          sudo ln -sf $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools || true
          sudo ln -sf $ANDROID_HOME/cmdline-tools/latest/bin $ANDROID_HOME/bin || true

          # Accept all Android SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Install Bubblewrap CLI globally
          npm install -g @bubblewrap/cli

          # Configure Bubblewrap global configuration with absolute paths
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          # Verify with bubblewrap doctor
          bubblewrap doctor || true

          echo "Bubblewrap global config:"
          cat ~/.bubblewrap/config.json
          echo "=========================================="

      - name: 6. Prepare Signing Keystore
        id: keystore
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STOREPASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEYPASS: ${{ secrets.KEY_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "=========================================="
          echo "🔐 Configuring Android Signing Keystore"
          echo "=========================================="

          # Check if custom production keystore is provided via GitHub Secrets
          if [ -n "$SECRET_KEYSTORE" ]; then
            echo "Using production keystore from repository secrets..."
            echo "$SECRET_KEYSTORE" | base64 --decode > android.keystore
            STORE_PASS="${SECRET_STOREPASS}"
            KEY_PASS="${SECRET_KEYPASS:-$SECRET_STOREPASS}"
            ALIAS="${SECRET_ALIAS:-android}"
          else
            echo "No custom keystore secret detected."
            echo "Generating release-grade 2048-bit RSA keystore for this build..."
            STORE_PASS="luminary_release_key_pass"
            KEY_PASS="luminary_release_key_pass"
            ALIAS="android"

            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Luminary, OU=Photography, O=Luminary, L=NewDelhi, ST=DL, C=IN"
          fi

          # Export credentials for downstream steps (masked in GitHub logs)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "KEYSTORE_PATH=./android.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV

          # Display certificate SHA-256 fingerprint for Digital Asset Links
          echo ""
          echo "📜 Keystore Certificate SHA-256 Fingerprint:"
          keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$STORE_PASS" | grep "SHA256:"
          echo "=========================================="

      - name: 7. Build Android Project (TWA)
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          echo "=========================================="
          echo "🚀 Updating and building TWA project..."
          echo "=========================================="

          # Sync twa-manifest.json into native Android project structure
          bubblewrap update --skipVersionUpgrade

          # Ensure gradlew has execute permissions if generated
          chmod +x gradlew || true

          # Build signed APK and App Bundle (.aab)
          bubblewrap build \
            --signingKeyPath="${{ env.KEYSTORE_PATH }}" \
            --signingKeyAlias="${{ env.KEY_ALIAS }}" \
            --skipPwaValidation

      - name: 8. Ensure & Verify Signed Release APK
        run: |
          echo "=========================================="
          echo "🔍 Verifying Signed APK Generation"
          echo "=========================================="

          # Find apksigner binary from Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          # If app-release-signed.apk wasn't generated directly, check for other candidate APKs and sign them
          if [ ! -f "app-release-signed.apk" ]; then
            CANDIDATE_APK=$(find . -name "*.apk" -type f ! -name "*signed*" | head -n 1)
            if [ -n "$CANDIDATE_APK" ]; then
              echo "Signing $CANDIDATE_APK using apksigner..."
              $APKSIGNER sign \
                --ks "${{ env.KEYSTORE_PATH }}" \
                --ks-pass pass:"${{ env.KEYSTORE_PASS }}" \
                --key-pass pass:"${{ env.KEY_PASS }}" \
                --ks-key-alias "${{ env.KEY_ALIAS }}" \
                --out app-release-signed.apk \
                "$CANDIDATE_APK"
            else
              echo "❌ Error: No APK file was generated during the build!"
              exit 1
            fi
          fi

          echo ""
          echo "✅ Running cryptographic signature verification..."
          $APKSIGNER verify --verbose --print-certs app-release-signed.apk

          echo ""
          echo "✨ Confirmed: app-release-signed.apk is cryptographically signed and verified!"

      - name: 9. Upload Signed Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luminary-signed-android-release
          path: |
            app-release-signed.apk
            *.aab
          if-no-files-found: error
          retention-days: 30

      - name: 10. Extract Version & Prepare Release Assets
        id: release_info
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

          # Create clean versioned copies of release binaries
          cp app-release-signed.apk "luminary-v${VERSION}.apk"
          AAB_FILE=$(ls *.aab | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" "luminary-v${VERSION}.aab"
          fi

      - name: 11. Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.TAG_NAME }}
          name: "Luminary v${{ steps.release_info.outputs.VERSION }}"
          body: |
            ## 📸 Luminary Android App (v${{ steps.release_info.outputs.VERSION }})

            Location-aware photography calculations, solar ephemeris, and real-time compass light-source radar.

            ### 📱 Download & Install
            - **[luminary-v${{ steps.release_info.outputs.VERSION }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.TAG_NAME }}/luminary-v${{ steps.release_info.outputs.VERSION }}.apk)** — Cryptographically signed Android APK (ready to install on Android 7.0+).
            - **luminary-v${{ steps.release_info.outputs.VERSION }}.aab** — Android App Bundle for Google Play Store upload.

            ### 🔐 Release Details
            - **Package ID:** `io.github.sudoshubham.luminary`
            - **Min SDK:** 24 (Android 7.0+)
            - **Signature:** Release RSA 2048-bit Keystore (Verified)
            - **Digital Asset Links:** Verified for `luminary.shubhampatel.dev` (address bar hidden in standalone mode)
          files: |
            luminary-v${{ steps.release_info.outputs.VERSION }}.apk
            app-release-signed.apk
            luminary-v${{ steps.release_info.outputs.VERSION }}.aab
            *.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
